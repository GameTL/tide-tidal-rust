name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this manual release'
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: 'Force exact version (e.g. 0.3.2 or v0.3.2). Overrides bump.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve release version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.version.outputs.next }}
      last: ${{ steps.last_tag.outputs.tag }}
      app_changed: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Determine last tag
        id: last_tag
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            last="v0.0.0"
          fi
          echo "tag=$last" >> "$GITHUB_OUTPUT"

      # A release PR with only website/docs changes ships no new app: skip the
      # build, tag and GitHub release. pages.yml deploys the site on its own.
      # Manual runs always build.
      - name: Detect app changes since last tag
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          LAST: ${{ steps.last_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            sh scripts/changed.sh "$LAST" HEAD | grep '^app=' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Resolve bump
        id: bump
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="${INPUT_BUMP:-patch}"
          else
            labels=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '[.[].name]' || echo '[]')
            bump="patch"
            if echo "$labels" | jq -e 'index("release:major")' >/dev/null; then
              bump="major"
            elif echo "$labels" | jq -e 'index("release:minor")' >/dev/null; then
              bump="minor"
            elif echo "$labels" | jq -e 'index("release:patch")' >/dev/null; then
              bump="patch"
            fi
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          LAST: ${{ steps.last_tag.outputs.tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          forced="${INPUT_VERSION:-}"
          if [ -z "$forced" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            if echo "${PR_TITLE:-}" | grep -qE '^Release v?[0-9]+\.[0-9]+\.[0-9]+'; then
              forced=$(echo "$PR_TITLE" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            fi
          fi
          if [ -n "$forced" ]; then
            v="${forced#v}"
            next="v${v}"
            echo "next=$next" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="${LAST#v}"
          IFS='.' read -r major minor patch <<< "$v"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          echo "next=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  build:
    name: Build universal dmg
    needs: resolve-version
    if: needs.resolve-version.outputs.app_changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Bump workspace version in tree
        env:
          NEXT: ${{ needs.resolve-version.outputs.next }}
        run: |
          set -euo pipefail
          v="${NEXT#v}"
          # Keep Cargo.toml workspace.package.version in sync for Info.plist.
          perl -i -pe "s/^version = \"\\d+\\.\\d+\\.\\d+\"/version = \"$v\"/" Cargo.toml
          cargo metadata --locked --no-deps --format-version 1 >/dev/null || cargo generate-lockfile

      # Optional: with a Developer ID certificate the app is signed and notarized,
      # so Gatekeeper opens it without the "Apple could not verify" warning.
      # Secrets: APPLE_CERTIFICATE_P12 (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12:-}" ]; then
            echo "No signing certificate configured; building ad-hoc signed."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=1" >> "$GITHUB_OUTPUT"

      - name: Package universal dmg
        id: pack
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.cert.outputs.signed == '1' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-macos.sh
          dmg_path=$(sh scripts/package-macos.sh release --universal --dmg)
          cp "$dmg_path" "$GITHUB_WORKSPACE/TIDE-release.dmg"
          basename "$dmg_path" > "$GITHUB_WORKSPACE/dmg-basename.txt"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: |
            TIDE-release.dmg
            dmg-basename.txt
          if-no-files-found: error

  tag-and-release:
    name: Tag and publish
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    outputs:
      next: ${{ needs.resolve-version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download dmg
        uses: actions/download-artifact@v4
        with:
          name: release-macos-universal
          path: dist

      - name: Create tag
        env:
          NEXT: ${{ needs.resolve-version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "Tag $NEXT already exists"
          else
            git tag -a "$NEXT" -m "Release $NEXT"
            git push origin "$NEXT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.resolve-version.outputs.next }}
          LAST: ${{ needs.resolve-version.outputs.last }}
        run: |
          set -euo pipefail
          name=$(cat dist/dmg-basename.txt)
          mv dist/TIDE-release.dmg "dist/$name"
          # Fixed name so releases/latest/download/TIDE-macos-universal.dmg
          # always serves the newest build (the website's download button).
          cp "dist/$name" dist/TIDE-macos-universal.dmg
          if git rev-parse "$LAST" >/dev/null 2>&1 && [ "$LAST" != "v0.0.0" ]; then
            notes=$(git log "$LAST".."$NEXT" --pretty='- %s (%h)' --no-merges || true)
          else
            notes=$(git log "$NEXT" --pretty='- %s (%h)' --no-merges || true)
          fi
          if gh release view "$NEXT" >/dev/null 2>&1; then
            gh release upload "$NEXT" "dist/$name" dist/TIDE-macos-universal.dmg --clobber
          else
            gh release create "$NEXT" \
              --title "$NEXT" \
              --target main \
              --notes "$notes" \
              "dist/$name" dist/TIDE-macos-universal.dmg
          fi

  # Deploying from here would run on the PR's merge ref, which the github-pages
  # environment rejects, so hand off to pages.yml on main. It runs after the
  # release exists, so releases.json lists the new version.
  deploy-site:
    name: Update website + Pages
    needs: tag-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
