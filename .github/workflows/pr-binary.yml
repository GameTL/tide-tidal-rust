name: PR binary

on:
  pull_request:
    branches: [staging, main]
    # Website/docs-only PRs don't change the app, so there's nothing to build.
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - 'scripts/write-releases-json.sh'
      - 'scripts/changed.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-pr.yml'

permissions:
  contents: read

concurrency:
  group: pr-binary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Check only: the universal dev zip took too long on macos-latest and was
    # cancelled, failing PRs that only needed to compile.
    name: Check build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --locked
