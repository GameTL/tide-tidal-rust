name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/write-releases-json.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Refresh releases.json when possible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/write-releases-json.sh
          sh scripts/write-releases-json.sh website/src/data/releases.json || true

      - name: Build Astro site
        working-directory: website
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell IndexNow (Bing, DuckDuckGo, Yandex, Seznam) the page changed. The
      # key is public and served from the site itself; Google ignores IndexNow
      # and needs the sitemap submitted in Search Console instead.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          key=$(sed -n "s/.*indexNowKey: '\([0-9a-f]*\)'.*/\1/p" website/src/data/site.ts)
          [ -n "$key" ] || exit 0
          curl -fsS -o /dev/null -w 'IndexNow: %{http_code}\n' --get \
            --data-urlencode "url=${PAGE_URL}" \
            --data-urlencode "key=${key}" \
            --data-urlencode "keyLocation=${PAGE_URL}${key}.txt" \
            https://api.indexnow.org/indexnow
